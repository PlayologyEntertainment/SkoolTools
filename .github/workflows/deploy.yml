name: Deploy SkoolToolz to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'SkoolToolz.html'
      - 'calculus-engine.js'
      - 'ap-packs.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload SkoolToolz.html via FTP
        run: |
          curl -T SkoolToolz.html \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/SkoolToolz.html"

      - name: Upload calculus-engine.js via FTP
        run: |
          curl -T calculus-engine.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/calculus-engine.js"

      - name: Upload ap-packs.js via FTP
        run: |
          curl -T ap-packs.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/ap-packs.js"
