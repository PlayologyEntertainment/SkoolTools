name: Deploy SkoolToolz to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'SkoolToolz.html'
      - 'privacy.html'
      - 'terms.html'
      - 'calculus-engine.js'
      - 'algebra-engine.js'
      - 'ap-packs.js'
      - 'ap-psych.js'
      - 'reading-writing-data.js'
      - 'genetics-engine.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload SkoolToolz.html via FTP
        run: |
          curl -T SkoolToolz.html \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/SkoolToolz.html"

      - name: Upload privacy.html via FTP
        run: |
          curl -T privacy.html \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/privacy.html"

      - name: Upload terms.html via FTP
        run: |
          curl -T terms.html \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/terms.html"

      - name: Upload calculus-engine.js via FTP
        run: |
          curl -T calculus-engine.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/calculus-engine.js"

      - name: Upload algebra-engine.js via FTP
        run: |
          curl -T algebra-engine.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/algebra-engine.js"

      - name: Upload ap-packs.js via FTP
        run: |
          curl -T ap-packs.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/ap-packs.js"

      - name: Upload ap-psych.js via FTP
        run: |
          curl -T ap-psych.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/ap-psych.js"

      - name: Upload reading-writing-data.js via FTP
        run: |
          curl -T reading-writing-data.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/reading-writing-data.js"

      - name: Upload genetics-engine.js via FTP
        run: |
          curl -T genetics-engine.js \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --max-time 60 \
            --connect-timeout 20 \
            "ftp://ftp.playologyentertainment.com/SkoolToolz/genetics-engine.js"
